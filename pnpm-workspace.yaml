packages:
  - 'apps/*'
  - 'apps/demo/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  better-sqlite3: true
  es5-ext: true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@dt-frames/vite-plugin@5.0.1 || 5.0.2'
  - '@dt-frames/layout@5.0.1 || 5.0.2'
