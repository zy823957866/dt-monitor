name: ${COMPOSE_PROJECT_NAME:-jianwei1}

x-backend-environment: &backend-environment
  NODE_ENV: production
  TZ: Asia/Shanghai
  PORT: 3001
  DB_TYPE: mysql
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_USERNAME: ${DB_USERNAME:-monitor}
  DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in docker/.env}"
  DB_DATABASE: ${DB_DATABASE:-dt_monitor}
  DB_TIMEZONE: +08:00
  DB_CHARSET: utf8mb4
  DB_SYNCHRONIZE: "false"
  AUTH_DB_TYPE: mysql
  AUTH_DB_HOST: ${AUTH_DB_HOST:-mysql}
  AUTH_DB_PORT: ${AUTH_DB_PORT:-3306}
  AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-monitor}
  AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in docker/.env}"
  AUTH_DB_DATABASE: ${AUTH_DB_DATABASE:-dt_frames}
  AUTH_DB_SYNCHRONIZE: "false"
  AUTH_SERVER_URL: ${AUTH_SERVER_URL:-http://host.docker.internal:3010/api}
  AUTH_SERVER_TIMEOUT: ${AUTH_SERVER_TIMEOUT:-10000}
  JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in docker/.env}"
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in docker/.env}"
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-5000}
  REDIS_TTL: ${REDIS_TTL:-3600}
  CORS_ORIGINS: "${CORS_ORIGINS:?set CORS_ORIGINS in docker/.env}"
  MONITOR_APP_BASE_URL: "${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in docker/.env}"
  MONITOR_DSN_ORIGIN: "${MONITOR_DSN_ORIGIN:?set MONITOR_DSN_ORIGIN in docker/.env}"
  REPLAY_STORAGE_DIR: /app/data/replays

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    networks:
      default:
        aliases:
          - jianwei1-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}"
      MYSQL_DATABASE: ${DB_DATABASE:-dt_monitor}
      MYSQL_USER: ${DB_USERNAME:-monitor}
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in docker/.env}"
      AUTH_DB_DATABASE: ${AUTH_DB_DATABASE:-dt_frames}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    networks:
      default:
        aliases:
          - jianwei1-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${BACKEND_IMAGE:-jianwei1-backend:local}
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    restart: "no"
    command:
      - node
      - node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/database/data-source.js
    environment:
      <<: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway

  backend:
    image: ${BACKEND_IMAGE:-jianwei1-backend:local}
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *backend-environment
    volumes:
      - replay_data:/app/data/replays
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway

  seed:
    profiles: ["tools"]
    image: ${BACKEND_IMAGE:-jianwei1-backend:local}
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    restart: "no"
    command:
      - node
      - dist/scripts/seed-monitor-auth.js
    environment:
      <<: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway

  web:
    image: ${WEB_IMAGE:-jianwei1-web:local}
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        VITE_SSO_URL: "${VITE_SSO_URL:?set VITE_SSO_URL in docker/.env}"
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-monitor}
        VITE_APP_CODE: ${VITE_APP_CODE:-monitor}
        VITE_APP_ID: ${VITE_APP_ID:-monitor}
        VITE_APP_ROUTER_BASE: ${VITE_APP_ROUTER_BASE:-/}
        VITE_APP_MODE: prod
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:3001
      AUTH_API_UPSTREAM: ${AUTH_API_UPSTREAM:-http://host.docker.internal:3010}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  mysql_data:
  redis_data:
  replay_data:

networks:
  default:
    name: ${STACK_NETWORK:-jianwei1-net}
